<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0e13">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>Painel</title>
<style>
:root{--bg:#0b0e13;--card:#151a21;--card2:#1e252f;--fg:#e8eaed;--muted:#8d949e;--accent:#8ab4f8;--line:#232a34}
body.night{--bg:#000;--card:#07090c;--card2:#0c0f13;--fg:#5b626c;--muted:#3b4149;--accent:#33466a;--line:#10141a}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:clamp(11px,1.45vw,20px)}
html,body{height:100%;background:var(--bg);color:var(--fg);overflow:hidden;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.app{height:100%;display:grid;grid-template-columns:1.15fr 1fr 1fr;grid-template-rows:auto minmax(0,1fr);gap:.8rem;padding:.9rem}
.hd{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;padding:0 .3rem}
.clock{font-size:4.4rem;font-weight:500;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.date{font-size:1.15rem;color:var(--muted);margin-top:.35rem}
.wx{display:flex;align-items:center;gap:1rem}
.wx .now{display:flex;align-items:center;gap:.7rem}
.wx .ic{font-size:2.8rem;line-height:1}
.wx .tp{font-size:2.8rem;font-weight:500;line-height:1}
.wx .ds{font-size:.95rem;color:var(--muted);line-height:1.4}
.wx .nx{display:flex;gap:.5rem}
.wx .dd{background:var(--card);border-radius:.7rem;padding:.4rem .6rem;text-align:center;font-size:.8rem;color:var(--muted);min-width:4.4rem;line-height:1.35}
.wx .dd b{display:block;font-weight:500;font-size:1.15rem;color:var(--fg)}
body.night .wx .nx{display:none}
.card{background:var(--card);border-radius:.9rem;padding:.9rem 1rem;min-height:0;display:flex;flex-direction:column;overflow:hidden}
h2{font-size:.72rem;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:.5rem;display:flex;justify-content:space-between}
.agenda{grid-column:1;grid-row:2}
.casa{grid-column:2;grid-row:2}
.right{grid-column:3;grid-row:2;display:flex;flex-direction:column;gap:.8rem;min-height:0}
.list{flex:1;min-height:0;overflow:hidden}
.dayh{font-size:.88rem;color:var(--accent);margin:.6rem 0 .15rem;font-weight:500}
.dayh:first-child{margin-top:0}
.row{display:flex;gap:.6rem;align-items:flex-start;padding:.3rem 0;font-size:1rem;line-height:1.25;border-bottom:1px solid var(--line)}
.row .tm{width:3.7rem;flex:none;color:var(--muted);font-variant-numeric:tabular-nums;font-size:.9rem;padding-top:.04rem}
.row .dot{width:.55rem;height:.55rem;border-radius:50%;flex:none;margin-top:.42rem}
.row .tt{flex:1;min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row.past{opacity:.4}
.row.now{background:var(--card2);margin:0 -.5rem;padding-left:.5rem;padding-right:.5rem;border-radius:.4rem;border-bottom-color:transparent}
.row.empty{color:var(--muted);font-size:.9rem}
.more{font-size:.8rem;color:var(--muted);padding-top:.3rem}
.legend{display:flex;flex-wrap:wrap;gap:.2rem .9rem;font-size:.75rem;color:var(--muted);padding-top:.5rem}
.legend i{display:inline-block;width:.5rem;height:.5rem;border-radius:50%;margin-right:.3rem}
.ph{border:1px dashed var(--line);background:transparent;align-items:center;justify-content:center;text-align:center;color:var(--muted);font-size:.95rem;line-height:1.5}
.ph b{display:block;font-size:1.1rem;font-weight:500;margin-bottom:.2rem}
.hm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(10rem,1fr));gap:.6rem;flex:1;min-height:0;overflow:auto;align-content:start}
.hm-tile{background:var(--card2);border-radius:.75rem;display:flex;flex-direction:column;border:1px solid transparent}
.hm-tile.on{border-color:var(--accent)}
.hm-tile.off{opacity:.45}
.hm-btn{display:flex;flex-direction:column;align-items:flex-start;gap:.15rem;padding:.75rem .8rem;font:inherit;color:inherit;background:none;border:0;text-align:left;min-height:3.8rem;width:100%;cursor:pointer;-webkit-tap-highlight-color:transparent}
.hm-n{font-size:1.02rem;font-weight:500;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hm-s{font-size:.78rem;color:var(--muted)}
.hm-tile.on .hm-s{color:var(--accent)}
.hm-tile input[type=range]{width:calc(100% - 1.2rem);margin:.1rem .6rem .7rem;accent-color:var(--accent)}
.spot{flex:0 0 36%;padding:.8rem .9rem}
.spot button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.sp-c{display:flex;flex:1;min-height:0;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:.55rem;color:var(--muted);font-size:.9rem}
.sp-c b{color:var(--fg);font-weight:500;font-size:1.1rem}
.spot .sp-btn{background:var(--accent);color:#0b0e13;padding:.6rem 1.2rem;border-radius:.5rem;font-weight:500;font-size:1rem}
.sp-play{display:flex;gap:.85rem;flex:1;min-height:0}
.sp-art{height:100%;aspect-ratio:1/1;max-width:40%;flex:none;border-radius:.55rem;background:var(--card2);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:2.2rem;color:var(--muted)}
.sp-art img{width:100%;height:100%;object-fit:cover;display:block}
.sp-meta{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:space-between}
.sp-t{font-size:1.2rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp-a{font-size:.95rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp-bar{height:.28rem;background:var(--line);border-radius:1rem;overflow:hidden;margin:.3rem 0}
.sp-bar i{display:block;height:100%;width:0;background:var(--accent)}
.spot .sp-dev{font-size:.78rem;color:var(--muted);text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:.3rem 0}
.sp-ctl{display:flex;justify-content:center;align-items:center;gap:1.1rem}
.spot .sp-ctl button{padding:.35rem .7rem;border-radius:.5rem;line-height:0}
.spot .sp-ctl .big{background:var(--card2);padding:.5rem .9rem}
.sp-devs{flex:1;min-height:0;display:flex;flex-direction:column}
.sp-dl{flex:1;min-height:0;overflow:auto}
.spot .sp-dv{display:block;width:100%;text-align:left;padding:.55rem .3rem;border-bottom:1px solid var(--line);font-size:.98rem}
.spot .sp-dv.on{color:var(--accent)}
.sp-err{font-size:.75rem;color:#e8a05a;min-height:1em}
.spot [hidden]{display:none!important}
.news{flex:1}
#nlist{flex:1;min-height:0;overflow:hidden;transition:opacity .4s}
#nlist.fade{opacity:0}
.nitem{padding:.45rem 0;border-bottom:1px solid var(--line)}
.nitem small{display:block;font-size:.72rem;color:var(--accent);margin-bottom:.12rem}
.nitem div{font-size:.98rem;line-height:1.28;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.nitem{cursor:pointer;-webkit-tap-highlight-color:transparent}
.nitem:active{background:var(--card2)}
.nw-m{position:fixed;inset:0;background:rgba(0,0,0,.78);display:flex;align-items:center;justify-content:center;z-index:9}
.nw-m[hidden]{display:none}
.nw-b{background:var(--card);border-radius:1rem;padding:1.2rem 1.3rem;width:min(38rem,92vw);max-height:88vh;overflow:auto;display:flex;flex-direction:column;gap:.7rem}
.nw-b small{color:var(--accent);font-size:.85rem}
.nw-b h3{font-size:1.4rem;line-height:1.25;font-weight:500}
.nw-b p{font-size:1.05rem;line-height:1.5;color:var(--fg)}
.nw-b img{width:100%;max-height:14rem;object-fit:cover;border-radius:.6rem;display:block}
.nw-a{display:flex;gap:.7rem;justify-content:flex-end}
.nw-a a,.nw-a button{font:inherit;font-size:1.05rem;padding:.65rem 1.1rem;border-radius:.5rem;border:0;text-decoration:none;cursor:pointer}
.nw-a a{background:var(--accent);color:#0b0e13;font-weight:500}
.nw-a button{background:var(--card2);color:var(--fg)}
body.night .news{display:none}
body.night .right .spot{flex:1}
.compact .app{grid-template-columns:1.2fr 1fr}
.compact .casa,.compact .spot{display:none}
.compact .right{grid-column:2}
.status{position:fixed;left:1rem;bottom:.35rem;font-size:.68rem;color:var(--muted)}
.gate{position:fixed;inset:0;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;z-index:10}
.gate[hidden]{display:none}
.gate form{background:var(--card);border-radius:1rem;padding:1.4rem;width:min(28rem,90vw);display:flex;flex-direction:column;gap:.8rem}
.gate p{font-size:1rem;line-height:1.4}
.gate small{color:var(--muted);font-size:.8rem;min-height:1em}
.gate input{font-size:1.1rem;padding:.7rem;border-radius:.5rem;border:1px solid var(--line);background:var(--bg);color:var(--fg);-webkit-user-select:text;user-select:text}
.gate button{font-size:1.1rem;padding:.7rem;border:0;border-radius:.5rem;background:var(--accent);color:#0b0e13;font-weight:500}
</style>
</head>
<body>
<div class="app">
  <header class="hd">
    <div><div class="clock" id="clock">--:--</div><div class="date" id="date"></div></div>
    <div class="wx" id="wx"></div>
  </header>

  <section class="card agenda">
    <h2>Agenda</h2>
    <div class="list" id="agList"></div>
    <div class="more" id="agMore" hidden></div>
    <div class="legend" id="agLegend"></div>
  </section>

  <section class="card ph casa" id="casa"><div><b>Casa</b>Luzes e tomadas<br>por ligar (fase 4)</div></section>

  <div class="right">
    <section class="card ph spot" id="spot"><div><b>Spotify</b>por ligar (fase 2)</div></section>
    <section class="card news" id="news">
      <h2><span>Notícias</span><span id="npg"></span></h2>
      <div id="nlist"></div>
    </section>
  </div>
</div>

<div class="status" id="status"></div>

<div class="nw-m" id="nwM" hidden><div class="nw-b" id="nwB"></div></div>

<div class="gate" id="gate" hidden>
  <form id="gateForm" autocomplete="off">
    <p><b>Chave de acesso</b><br>Introduz a chave que definiste no Worker. Só é pedida uma vez neste tablet.</p>
    <input id="gateKey" type="password" placeholder="Chave" autocapitalize="off" autocorrect="off" spellcheck="false">
    <small id="gateMsg"></small>
    <button type="submit">Guardar</button>
  </form>
</div>

<script src="config.js"></script>
<script>
(function () {
'use strict';

var C = Object.assign({
  WORKER_URL: '', LAT: 38.7, LON: -9.36,
  NIGHT_START: 23, NIGHT_END: 7, RELOAD_HOUR: 4,
  AGENDA_DAYS: 2, NEWS_PER_PAGE: 4, NEWS_ROTATE_SECONDS: 10,
  SHOW_PLACEHOLDERS: true,
  ICAL_URL: 'https://cdnjs.cloudflare.com/ajax/libs/ical.js/1.5.0/ical.min.js'
}, window.DASH_CONFIG || {});

var Q = new URLSearchParams(location.search);
var DEMO = Q.get('demo') === '1';
var HAS_WORKER = !!C.WORKER_URL && C.WORKER_URL.indexOf('SEU-WORKER') < 0;

function $(id) { return document.getElementById(id); }
function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function pad(n) { return (n < 10 ? '0' : '') + n; }
function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
function clear(n) { while (n.firstChild) n.removeChild(n.firstChild); }
function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }

if (!C.SHOW_PLACEHOLDERS) document.body.classList.add('compact');

/* ---------- estado e mensagens ---------- */
var statusMsgs = {};
function setStatus(k, msg) {
  if (msg) statusMsgs[k] = msg; else delete statusMsgs[k];
  $('status').textContent = Object.keys(statusMsgs).map(function (x) { return statusMsgs[x]; }).join(' · ');
}

/* ---------- relógio, data, modo noturno ---------- */
var fmtDate = new Intl.DateTimeFormat('pt-PT', { weekday: 'long', day: 'numeric', month: 'long' });
var fmtDay = new Intl.DateTimeFormat('pt-PT', { weekday: 'short', day: 'numeric', month: 'short' });
var fmtWd = new Intl.DateTimeFormat('pt-PT', { weekday: 'short' });
var lastT = '';

function isNight(h) {
  var a = C.NIGHT_START, b = C.NIGHT_END;
  return a > b ? (h >= a || h < b) : (h >= a && h < b);
}

function tickClock() {
  var d = new Date();
  var t = pad(d.getHours()) + ':' + pad(d.getMinutes());
  if (t === lastT) return;
  lastT = t;
  $('clock').textContent = t;
  $('date').textContent = cap(fmtDate.format(d));
  document.body.classList.toggle('night', isNight(d.getHours()));
  renderAgenda();
  maybeReload(d);
}

function maybeReload(d) {
  if (DEMO || d.getHours() !== C.RELOAD_HOUR) return;
  var last = parseInt(store('dash_last_reload') || '0', 10);
  if (Date.now() - last > 20 * 3600 * 1000) { store('dash_last_reload', String(Date.now())); location.reload(); }
}

/* ---------- ecrã sempre ligado ---------- */
var wl = null;
function keepAwake() {
  if (!navigator.wakeLock) return;
  navigator.wakeLock.request('screen').then(function (l) {
    wl = l; l.addEventListener('release', function () { wl = null; });
  }).catch(function () {});
}
document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') keepAwake(); });

/* ---------- acesso ao Worker ---------- */
function getKey() { return store('dash_key') || ''; }
function showGate(msg) { $('gate').hidden = false; $('gateMsg').textContent = msg || ''; $('gateKey').focus(); }
$('gateForm').addEventListener('submit', function (e) {
  e.preventDefault();
  var v = $('gateKey').value.trim();
  if (!v) return;
  store('dash_key', v);
  $('gateKey').value = '';
  $('gate').hidden = true;
  loadAll();
});

function api(path, body) {
  var o = { headers: { 'X-Dash-Key': getKey() }, cache: 'no-store' };
  if (body) { o.method = 'POST'; o.headers['Content-Type'] = 'application/json'; o.body = JSON.stringify(body); }
  return fetch(C.WORKER_URL.replace(/\/$/, '') + path, o)
    .then(function (r) {
      if (r.status === 401) { showGate('Chave incorreta. Tenta outra vez.'); throw new Error('401'); }
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    });
}

/* ---------- meteo (Open-Meteo, sem chave) ---------- */
var WMO = {
  0: ['Céu limpo', '☀️'], 1: ['Pouco nublado', '🌤️'], 2: ['Parcialmente nublado', '⛅'], 3: ['Nublado', '☁️'],
  45: ['Nevoeiro', '🌫️'], 48: ['Nevoeiro', '🌫️'],
  51: ['Chuvisco', '🌦️'], 53: ['Chuvisco', '🌦️'], 55: ['Chuvisco', '🌦️'], 56: ['Chuvisco gelado', '🌧️'], 57: ['Chuvisco gelado', '🌧️'],
  61: ['Chuva fraca', '🌧️'], 63: ['Chuva', '🌧️'], 65: ['Chuva forte', '🌧️'], 66: ['Chuva gelada', '🌧️'], 67: ['Chuva gelada', '🌧️'],
  71: ['Neve fraca', '❄️'], 73: ['Neve', '❄️'], 75: ['Neve forte', '❄️'], 77: ['Grãos de neve', '❄️'],
  80: ['Aguaceiros', '🌦️'], 81: ['Aguaceiros', '🌦️'], 82: ['Aguaceiros fortes', '🌧️'], 85: ['Aguaceiros de neve', '❄️'], 86: ['Aguaceiros de neve', '❄️'],
  95: ['Trovoada', '⛈️'], 96: ['Trovoada com granizo', '⛈️'], 99: ['Trovoada com granizo', '⛈️']
};
function wmo(code, day) {
  var w = WMO[code] || ['—', '🌡️'];
  var icon = w[1];
  if (day === 0 && (code === 0 || code === 1)) icon = '🌙';
  return { text: w[0], icon: icon };
}

function renderWeather(j) {
  var box = $('wx'); clear(box);
  var cur = j.current, d = j.daily;
  var w = wmo(cur.weather_code, cur.is_day);
  var now = el('div', 'now');
  now.appendChild(el('div', 'ic', w.icon));
  now.appendChild(el('div', 'tp', Math.round(cur.temperature_2m) + '°'));
  var ds = el('div', 'ds');
  ds.appendChild(document.createTextNode(w.text));
  ds.appendChild(el('br'));
  ds.appendChild(document.createTextNode('máx ' + Math.round(d.temperature_2m_max[0]) + '° · mín ' + Math.round(d.temperature_2m_min[0]) + '° · chuva ' + (d.precipitation_probability_max[0] || 0) + '%'));
  now.appendChild(ds);
  box.appendChild(now);
  var nx = el('div', 'nx');
  for (var i = 1; i < d.time.length && i < 3; i++) {
    var dd = el('div', 'dd');
    var dt = new Date(d.time[i] + 'T12:00:00');
    dd.appendChild(document.createTextNode(cap(fmtWd.format(dt).replace('.', ''))));
    dd.appendChild(el('b', null, wmo(d.weather_code[i], 1).icon));
    dd.appendChild(document.createTextNode(Math.round(d.temperature_2m_max[i]) + '° / ' + Math.round(d.temperature_2m_min[i]) + '°'));
    nx.appendChild(dd);
  }
  box.appendChild(nx);
}

function loadWeather() {
  if (DEMO) {
    renderWeather({
      current: { temperature_2m: 21.6, weather_code: 2, is_day: 1 },
      daily: {
        time: ['2026-10-16', '2026-10-17', '2026-10-18'], weather_code: [2, 61, 0],
        temperature_2m_max: [23.4, 20.1, 22.8], temperature_2m_min: [14.9, 15.2, 13.7], precipitation_probability_max: [10, 70, 5]
      }
    });
    return;
  }
  var url = 'https://api.open-meteo.com/v1/forecast?latitude=' + C.LAT + '&longitude=' + C.LON +
    '&current=temperature_2m,weather_code,is_day&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=3';
  fetch(url).then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function (j) { renderWeather(j); setStatus('wx'); })
    .catch(function () { setStatus('wx', 'Meteo sem ligação'); setTimeout(loadWeather, 60000); });
}

/* ---------- agenda ---------- */
var events = [];
var sources = [];
var agendaState = 'idle'; // idle | ok | off

function loadIcal() {
  if (window.ICAL) return Promise.resolve();
  return new Promise(function (res, rej) {
    var s = document.createElement('script');
    s.src = C.ICAL_URL; s.crossOrigin = 'anonymous';
    s.onload = res;
    s.onerror = function () { s.parentNode.removeChild(s); rej(new Error('ical.js')); };
    document.head.appendChild(s);
  });
}

function toDate(t) { return t.isDate ? new Date(t.year, t.month - 1, t.day) : t.toJSDate(); }

function parseSource(src, ws, we, out) {
  var comp = new ICAL.Component(ICAL.parse(src.ics));
  comp.getAllSubcomponents('vtimezone').forEach(function (tz) { try { ICAL.TimezoneService.register(tz); } catch (e) {} });

  var masters = {}, exceptions = [];
  comp.getAllSubcomponents('vevent').forEach(function (ve) {
    var st = String(ve.getFirstPropertyValue('status') || '').toUpperCase();
    if (st === 'CANCELLED') return;
    var ev = new ICAL.Event(ve);
    if (ev.isRecurrenceException()) exceptions.push(ev);
    else masters[ev.uid + '#' + Object.keys(masters).length] = ev;
  });
  var byUid = {};
  Object.keys(masters).forEach(function (k) { byUid[masters[k].uid] = masters[k]; });
  var all = Object.keys(masters).map(function (k) { return masters[k]; });
  exceptions.forEach(function (ex) {
    var m = byUid[ex.uid];
    if (m) m.relateException(ex); else all.push(ex);
  });

  function add(item, s, e) {
    var allDay = !!s.isDate;
    var start = toDate(s), end = toDate(e);
    if (!(end > start)) end = allDay ? new Date(start.getFullYear(), start.getMonth(), start.getDate() + 1) : start;
    var inside = end > start ? (start < we && end > ws) : (start >= ws && start < we);
    if (!inside) return;
    out.push({ start: start, end: end, allDay: allDay, title: item.summary || '(sem título)', color: src.color || '#8ab4f8', source: src.name });
  }

  all.forEach(function (ev) {
    if (ev.isRecurring()) {
      var it = ev.iterator(), next, guard = 0, limit = we.getTime() + 14 * 864e5;
      while ((next = it.next()) && guard++ < 20000) {
        if (toDate(next).getTime() > limit) break;
        var o = ev.getOccurrenceDetails(next);
        add(o.item, o.startDate, o.endDate);
      }
    } else {
      add(ev, ev.startDate, ev.endDate);
    }
  });
}

function buildEvents(srcList) {
  var n = new Date();
  var ws = new Date(n.getFullYear(), n.getMonth(), n.getDate());
  var we = new Date(ws.getFullYear(), ws.getMonth(), ws.getDate() + C.AGENDA_DAYS);
  var out = [], bad = [];
  srcList.forEach(function (s) {
    if (!s.ics) { bad.push(s.name); return; }
    try { parseSource(s, ws, we, out); } catch (e) { bad.push(s.name); }
  });
  // remove duplicados (o mesmo evento sincronizado em dois calendários)
  var seen = {}, uniq = [];
  out.sort(function (a, b) { return a.start - b.start; });
  out.forEach(function (e) {
    var k = e.title.toLowerCase() + '|' + e.start.getTime() + '|' + e.allDay;
    if (seen[k]) return; seen[k] = 1; uniq.push(e);

}

function dayLabel(i, d) {
  if (i === 0) return 'Hoje · ' + fmtDay.format(d).replace(/\./g, '');
  if (i === 1) return 'Amanhã · ' + fmtDay.format(d).replace(/\./g, '');
  return cap(fmtDay.format(d).replace(/\./g, ''));
}

function renderAgenda() {
  var list = $('agList'), more = $('agMore'), lg = $('agLegend');
  clear(list); clear(lg); more.hidden = true;
  if (agendaState === 'idle') {
    list.appendChild(el('div', 'row empty', HAS_WORKER || DEMO ? 'A carregar…' : 'Agenda por ligar (falta configurar o Worker).'));
    return;
  }
  if (agendaState === 'off') {
    list.appendChild(el('div', 'row empty', 'Agenda sem ligação. A tentar de novo…'));
    return;
  }
  var now = new Date();
  var ws = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  for (var i = 0; i < C.AGENDA_DAYS; i++) {
    var ds = new Date(ws.getFullYear(), ws.getMonth(), ws.getDate() + i);
    var de = new Date(ws.getFullYear(), ws.getMonth(), ws.getDate() + i + 1);
    var day = events.filter(function (e) {
      return e.end > e.start ? (e.start < de && e.end > ds) : (e.start >= ds && e.start < de);
    });
    day.sort(function (a, b) { return (b.allDay - a.allDay) || (a.start - b.start); });
    list.appendChild(el('div', 'dayh', dayLabel(i, ds)));
    if (!day.length) { list.appendChild(el('div', 'row empty', 'Sem eventos')); continue; }
    day.forEach(function (e) {
      var r = el('div', 'row');
      var past = !e.allDay && e.end <= now && i === 0;
      var cur = !e.allDay && e.start <= now && e.end > now;
      if (past) r.className += ' past';
      if (cur) r.className += ' now';
      var tm = e.allDay ? 'Dia todo' : (e.start < ds ? 'cont.' : pad(e.start.getHours()) + ':' + pad(e.start.getMinutes()));
      r.appendChild(el('span', 'tm', tm));
      var dot = el('span', 'dot'); dot.style.background = e.color; r.appendChild(dot);
      r.appendChild(el('span', 'tt', e.title));
      list.appendChild(r);
    });
  }
  fitAgenda(list, more);
  sources.forEach(function (s) {
    var item = el('span');
    var d = el('i'); d.style.background = s.color || '#8ab4f8';
    item.appendChild(d);
    item.appendChild(document.createTextNode(s.name + (s.error || !s.ics ? ' ⚠' : '')));
    lg.appendChild(item);
  });
}

function fitAgenda(list, more) {
  var removed = 0, guard = 300;
  function over() { return list.scrollHeight > list.clientHeight + 1; }
  while (over() && guard--) {
    var t = list.querySelector('.row.past');
    var silent = !!t;
    if (!t) {
      var rows = list.querySelectorAll('.row:not(.empty)');
      t = rows[rows.length - 1];
    }
    if (!t) break;
    t.parentNode.removeChild(t);
    if (!silent) removed++;
  }
  // cabeçalhos de dia que ficaram sem nada por baixo
  var kids = [].slice.call(list.children);
  kids.forEach(function (k, idx) {
    if (k.className === 'dayh' && (!kids[idx + 1] || kids[idx + 1].className === 'dayh')) {
      if (k.parentNode) k.parentNode.removeChild(k);
    }
  });
  if (removed) { more.textContent = '+' + removed + ' mais'; more.hidden = false; }
}

function cleanText(t) {
  var s = new DOMParser().parseFromString(String(t), 'text/html').documentElement.textContent || '';
  return s.replace(/\s+/g, ' ').trim();
}
function nodeText(node, tag) { var n = node.getElementsByTagName(tag)[0]; return n ? n.textContent : ''; }

function itemLink(it) {
  var ls = [].slice.call(it.getElementsByTagName('link')), h = '';
  for (var i = 0; i < ls.length && !h; i++) { var r = ls[i].getAttribute('rel'); if (!r || r === 'alternate') h = (ls[i].getAttribute('href') || ls[i].textContent || '').trim(); }
  return /^https?:\/\//i.test(h) ? h : '';
}
function itemDesc(it) {
  var t = nodeText(it, 'description') || nodeText(it, 'summary') || nodeText(it, 'content:encoded') || nodeText(it, 'content');
  t = cleanText(t);
  return t.length > 600 ? t.slice(0, 600).replace(/\s\S*$/, '') + '…' : t;
}
function itemImg(it) {
  var u = '', n = it.getElementsByTagName('enclosure')[0];
  if (n && /^image/.test(n.getAttribute('type') || 'image')) u = n.getAttribute('url') || '';
  if (!u) { n = it.getElementsByTagName('media:content')[0] || it.getElementsByTagName('media:thumbnail')[0]; if (n) u = n.getAttribute('url') || ''; }
  if (!u) { var m = /<img[^>]+src=["']([^"']+)["']/i.exec(nodeText(it, 'description') + nodeText(it, 'content:encoded')); if (m) u = m[1]; }
  return /^https:\/\//i.test(u) ? u : '';
}

function parseFeed(name, xml) {
  var doc = new DOMParser().parseFromString(xml, 'text/xml');
  if (doc.getElementsByTagName('parsererror').length) return [];
  var items = [].slice.call(doc.getElementsByTagName('item'));
  if (!items.length) items = [].slice.call(doc.getElementsByTagName('entry'));
  return items.slice(0, 10).map(function (it) {
    var d = nodeText(it, 'pubDate') || nodeText(it, 'published') || nodeText(it, 'updated');
    return { src: name, title: cleanText(nodeText(it, 'title')), ts: Date.parse(d) || 0, link: itemLink(it), desc: itemDesc(it), img: itemImg(it) };
  }).filter(function (x) { return x.title; });
}

function ago(ts) {
  if (!ts) return '';
  var m = Math.round((Date.now() - ts) / 60000);
  if (m < 1) return 'agora';
  if (m < 60) return 'há ' + m + ' min';
  var h = Math.round(m / 60);
  if (h < 24) return 'há ' + h + ' h';
  return 'há ' + Math.round(h / 24) + ' d';
}

var SP_ID = C.SPOTIFY_CLIENT_ID || '';
var SP_ON = !!SP_ID && SP_ID.indexOf('SEU') < 0;
var SP_SCOPE = 'user-read-playback-state user-modify-playback-state';
var sp = { state: null, t: 0, timer: null, view: 'play', devices: null, err: '', devTimer: null };
function drop(k) { try { localStorage.removeItem(k); } catch (e) {} }
function b64url(buf) { var s = ''; new Uint8Array(buf).forEach(function (b) { s += String.fromCharCode(b); }); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
function spRedirect() { return location.origin + location.pathname.replace(/index\.html$/, ''); }
function spLoggedIn() { return DEMO || !!store('sp_refresh'); }

function spLogin() {
  var a = new Uint8Array(64); crypto.getRandomValues(a);
  var v = b64url(a);
  crypto.subtle.digest('SHA-256', new TextEncoder().encode(v)).then(function (h) {
    store('sp_verifier', v);
    location.href = 'https://accounts.spotify.com/authorize?' + new URLSearchParams({
      client_id: SP_ID, response_type: 'code', redirect_uri: spRedirect(), scope: SP_SCOPE,
      code_challenge_method: 'S256', code_challenge: b64url(h)
    }).toString();
  });
}
function spToken(body) {
  return fetch('https://accounts.spotify.com/api/token', {
    method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: new URLSearchParams(body).toString()
  }).then(function (r) { if (!r.ok) throw new Error('token ' + r.status); return r.json(); }).then(function (j) {
    store('sp_access', j.access_token);
    store('sp_exp', String(Date.now() + (j.expires_in - 60) * 1000));
    if (j.refresh_token) store('sp_refresh', j.refresh_token);
    return j;
  });
}
function spExchange() {
  var code = Q.get('code'), v = store('sp_verifier');
  if (!code && !Q.get('error')) return Promise.resolve();
  history.replaceState(null, '', location.pathname);
  if (!code || !v) { sp.err = 'Login cancelado'; return Promise.resolve(); }
  return spToken({ client_id: SP_ID, grant_type: 'authorization_code', code: code, redirect_uri: spRedirect(), code_verifier: v })
    .then(function () { drop('sp_verifier'); })
    .catch(function () { sp.err = 'Não consegui ligar ao Spotify'; });
}
function spAccess() {
  var a = store('sp_access'), exp = +store('sp_exp') || 0;
  if (a && Date.now() < exp) return Promise.resolve(a);
  var r = store('sp_refresh');
  if (!r) return Promise.resolve(null);
  return spToken({ client_id: SP_ID, grant_type: 'refresh_token', refresh_token: r }).then(function (j) { return j.access_token; })
    .catch(function (e) { if (/token 4/.test(String(e.message))) { drop('sp_access'); drop('sp_refresh'); } return null; });
}
function spApi(method, path, body) {
  return spAccess().then(function (tok) {
    if (!tok) throw new Error('login');
    return fetch('https://api.spotify.com/v1' + path, {
      method: method, headers: { 'Authorization': 'Bearer ' + tok, 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined
    });
  }).then(function (r) {
    if (r.status === 204 || r.status === 202) return null;
    if (r.status === 401) { store('sp_exp', '0'); throw new Error('401'); }
    if (!r.ok) return r.json().catch(function () { return {}; }).then(function (j) { var e = new Error(String(r.status)); e.reason = j.error && j.error.reason; throw e; });
    return r.text().then(function (t) { return t ? JSON.parse(t) : null; });
  });
}

  if (DEMO || !spLoggedIn()) { spRender(); return; }
  var wait = 15000;
  spApi('GET', '/me/player').then(function (j) {
    sp.state = j; sp.t = Date.now(); sp.err = '';
    wait = j && j.is_playing ? 5000 : 15000;
  }).catch(function (e) {
    if (e.message === 'login') sp.state = null;
    else if (e.message !== '401') { sp.err = 'Spotify sem ligação'; wait = 30000; }
  }).then(function () {
    spRender();
    if (isNight(new Date().getHours())) wait = Math.max(wait, 60000);
    sp.timer = setTimeout(spPoll, document.hidden ? 60000 : wait);
  });
}
function spShow(id, on) { $(id).hidden = !on; }
function spRender() {
  if (!SP_ON) return;
  var li = spLoggedIn(), st = sp.state, it = st && st.item;
  var view = !li ? 'login' : sp.view === 'devs' ? 'devs' : it ? 'play' : 'idle';
  spShow('spLogin', view === 'login'); spShow('spIdle', view === 'idle'); spShow('spPlay', view === 'play'); spShow('spDevs', view === 'devs');
  ['spErr0', 'spErr1', 'spErr2'].forEach(function (i) { $(i).textContent = sp.err || ''; });
  if (view === 'devs') {
    var dl = $('spDl'); clear(dl);
    if (sp.devices === null) dl.appendChild(el('div', 'row empty', 'A procurar dispositivos…'));
    else if (!sp.devices.length) dl.appendChild(el('div', 'row empty', 'Nenhum dispositivo. Abre o Spotify no telemóvel e toca algo na coluna.'));
    else sp.devices.forEach(function (d) {
      var b = el('button', 'sp-dv' + (d.is_active ? ' on' : ''), (d.is_active ? '● ' : '') + d.name);
      b.addEventListener('click', function () { spTransfer(d.id); });
      dl.appendChild(b);
    });
  }
  if (view === 'play') {
    $('spTitle').textContent = it.name || '';
    $('spArtist').textContent = it.artists ? it.artists.map(function (a) { return a.name; }).join(', ') : (it.show && it.show.name) || '';
    $('spDev').textContent = (st.device && st.device.name ? '🔊 ' + st.device.name : 'Escolher dispositivo') + ' ▾';
    $('spPP').innerHTML = st.is_playing ? SPI.pause : SPI.play;
    var imgs = (it.album && it.album.images) || it.images || [], u = imgs.length ? imgs[Math.min(1, imgs.length - 1)].url : '';
    var art = $('spArt'), cur = art.getElementsByTagName('img')[0];
    if (u && /^https:\/\//.test(u)) {
      if (!cur || cur.getAttribute('src') !== u) { clear(art); var im = document.createElement('img'); im.alt = ''; im.src = u; art.appendChild(im); }
    } else if (cur) { clear(art); art.textContent = '♪'; }
    spTickBar();
  }
}
function spTickBar() {
  var st = sp.state, it = st && st.item;
  if (!it || !it.duration_ms) return;
  var p = (st.progress_ms || 0) + (st.is_playing ? Date.now() - sp.t : 0);
  $('spBar').style.width = Math.max(0, Math.min(100, p / it.duration_ms * 100)) + '%';
}
function spStart() {
  if (!SP_ON) return;
  spBuild();
  if (DEMO) {
    sp.state = { is_playing: true, progress_ms: 70000, device: { name: 'Coluna da sala' }, item: { name: 'Música de exemplo', duration_ms: 214000, artists: [{ name: 'Artista de exemplo' }], album: { images: [] } } };
    sp.t = Date.now(); spRender();
  } else {
    spExchange().then(function () { spRender(); spPoll(); });
  }
  setInterval(spTickBar, 1000);
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible' && !DEMO && spLoggedIn()) spPoll(); });
}

/* ---------- Casa (luzes e tomadas) ---------- */
var home = { devices: null, err: '', drag: 0, built: false, timer: null };
function homeBuild() {
  if (home.built) return; home.built = true;
  var c = $('casa'); c.className = 'card casa';
  c.innerHTML = '<h2><span>Casa</span><span id="hmMsg"></span></h2><div class="hm-grid" id="hmGrid"></div>';
}
function homeRender() {
  var g = $('hmGrid'); if (!g) return;
  if (Date.now() - home.drag < 4000) return;
  clear(g);
  $('hmMsg').textContent = home.err || '';
  if (home.devices === null) { g.appendChild(el('div', 'row empty', home.err ? '' : 'A carregar…')); return; }
  if (!home.devices.length) { g.appendChild(el('div', 'row empty', 'Sem dispositivos configurados.')); return; }
  home.devices.forEach(function (d) {
    var t = el('div', 'hm-tile' + (d.on ? ' on' : '') + (d.online === false ? ' off' : ''));
    var b = el('button', 'hm-btn');
    b.appendChild(el('span', 'hm-n', d.name));
    b.appendChild(el('span', 'hm-s', d.online === false ? 'Sem ligação' : d.on ? (d.canBright && d.brightness != null ? 'Ligado · ' + d.brightness + '%' : 'Ligado') : 'Desligado'));
    b.addEventListener('click', function () { homeToggle(d); });
    t.appendChild(b);
    if (d.canBright && d.on && d.online !== false) {
      var r = document.createElement('input'); r.type = 'range'; r.min = d.bmin; r.max = d.bmax; r.value = d.brightness || d.bmax;
      r.addEventListener('input', function () { home.drag = Date.now(); });
      r.addEventListener('change', function () { home.drag = 0; d.brightness = +r.value; homeSend(d, 'brightness', +r.value); homeRender(); });
      t.appendChild(r);
    }
    g.appendChild(t);
  });
}
function homeSend(d, action, value) {
  if (DEMO) return;
  api('/home/set', { provider: d.provider, id: d.id, sku: d.sku, action: action, value: value })
    .then(function () { home.err = ''; clearTimeout(home.timer); home.timer = setTimeout(homeLoad, 4000); })
    .catch(function (e) { if (String(e.message) === '401') return; home.err = 'Falhou'; homeLoad(); });
}
function homeToggle(d) {
  if (d.online === false) return;
  d.on = !d.on; homeRender();
  homeSend(d, 'power', d.on ? 1 : 0);
}
function homeLoad() {
  if (!HAS_WORKER && !DEMO) return;
  homeBuild();
  if (DEMO) {
    if (!home.devices) home.devices = [
      { provider: 'govee', id: '1', sku: 'x', name: 'Sala', canBright: true, bmin: 1, bmax: 100, on: true, brightness: 70, online: true },
      { provider: 'govee', id: '2', sku: 'x', name: 'Quarto', canBright: true, bmin: 1, bmax: 100, on: false, brightness: 30, online: true },
      { provider: 'govee', id: '3', sku: 'x', name: 'Secretária', canBright: false, on: true, online: true },
      { provider: 'govee', id: '4', sku: 'x', name: 'Varanda', canBright: false, on: false, online: false }];
    homeRender(); return;
  }
  api('/home').then(function (j) {
    home.devices = j.devices || [];
    home.err = (j.errors && j.errors.length) ? 'Erro: ' + j.errors[0].slice(0, 60) : '';
    homeRender();
  }).catch(function (e) {
    if (String(e.message) === '401') return;
    home.err = 'Sem ligação'; homeRender();
  });
}

/* ---------- arranque ---------- */
function loadAll() {
  loadWeather();
  loadAgenda();
  loadNews();
  homeLoad();
}

spStart();
tickClock();
setInterval(tickClock, 1000);
renderAgenda();
renderNews();
startNewsRotation();
keepAwake();

if (HAS_WORKER && !DEMO && !getKey()) showGate('');
else loadAll();

setInterval(loadWeather, 15 * 60 * 1000);
setInterval(loadAgenda, 10 * 60 * 1000);
setInterval(loadNews, 15 * 60 * 1000);
setInterval(function () { if (!document.hidden && !isNight(new Date().getHours())) homeLoad(); }, 30 * 1000);

if (!DEMO && 'serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').catch(function () {});
}

window.__dash = { buildEvents: buildEvents, demoSources: demoSources };
})();
</script>
