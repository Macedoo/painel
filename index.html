<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080f13">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>Painel</title>
<style>
:root{--bg:#080f13;--card:#0f1a20;--card2:#16252d;--fg:#e9f2f5;--muted:#8aa0aa;--accent:#5b8cff;--line:#ffffff14;--hi:#e8ff6b;--hiink:#1b2400;--hero:linear-gradient(160deg,#17303b,#0f1d25);--red:#ff5c7a}
body.night{--bg:#000;--card:#05080a;--card2:#0a0f12;--fg:#5b626c;--muted:#3b4149;--accent:#33466a;--line:#10141a;--hi:#3b4200;--hiink:#aab25a;--hero:linear-gradient(160deg,#05080a,#05080a);--red:#7a2e3d}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:clamp(11px,1.45vw,20px)}
html,body{height:100%;background:var(--bg);color:var(--fg);overflow:hidden;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.app{height:100%;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1.75fr) minmax(0,1.1fr);gap:.85rem;padding:.95rem}
.app.wk{grid-template-columns:minmax(0,1.3fr) minmax(0,2.85fr)}
.app.wk .c3{display:none}
.col{display:flex;flex-direction:column;gap:.85rem;min-height:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:1.3rem;padding:1.05rem 1.1rem;min-height:0;display:flex;flex-direction:column;overflow:hidden}
h2{white-space:nowrap;font-size:.95rem;font-weight:600;color:var(--fg);margin-bottom:.6rem;display:flex;justify-content:space-between;align-items:center;gap:.5rem}
h2 small{font-weight:400;color:var(--muted);font-size:.78rem}
.hero{background:var(--hero);padding:1.25rem 1.4rem 1.1rem;flex:none}
.clock{font-size:6.9rem;font-weight:600;letter-spacing:-.05em;line-height:.85;font-variant-numeric:tabular-nums;cursor:pointer}
.date{font-size:1.02rem;color:var(--muted);margin-top:.75rem;cursor:pointer}
.wx{display:flex;flex-direction:column;gap:.7rem;margin-top:.95rem;padding-top:.85rem;border-top:1px solid #ffffff1f;cursor:pointer}
.wx .now{display:flex;align-items:center;gap:.7rem}
.wx .ic{font-size:2.1rem;line-height:1}
.wx .tp{font-size:2.4rem;font-weight:500;line-height:1}
.wx .ds{font-size:.78rem;color:var(--muted);line-height:1.4}
.wx .nx{display:flex;justify-content:space-between;gap:.3rem}
.wx .dd{text-align:center;font-size:.68rem;color:var(--muted);line-height:1.4;flex:1}
.wx .dd b{display:block;font-weight:400;font-size:1.05rem;color:var(--fg);margin:.1rem 0}
body.night .wx .nx{display:none}
/* agenda */
.ag-h{display:flex;align-items:center;gap:.6rem;margin-bottom:.65rem;flex:none}
.ag-h h3{font-size:1.1rem;font-weight:600}
.ag-h .sub{font-size:.72rem;color:var(--muted)}
.ag-nav{display:flex;gap:.3rem}
.ag-nav button{width:1.9rem;height:1.9rem;border-radius:.65rem;background:var(--card2);font-size:1rem}
.seg{margin-left:auto;display:flex;background:var(--card2);border-radius:.8rem;padding:.2rem;gap:.1rem}
.seg button{font-size:.76rem;font-weight:500;padding:.38rem .75rem;border-radius:.6rem;color:var(--muted)}
.seg button.on{background:var(--accent);color:#06101a;font-weight:600}
.strip{display:flex;gap:.4rem;margin-bottom:.65rem;flex:none}
.strip button{flex:1;text-align:center;border-radius:.75rem;background:var(--card2);padding:.38rem 0;font-size:.64rem;color:var(--muted);text-transform:uppercase}
.strip button b{display:block;font-size:1.02rem;color:var(--fg);font-weight:600;margin-top:.1rem}
.strip button i{display:block;width:.28rem;height:.28rem;border-radius:50%;margin:.2rem auto 0;background:var(--accent)}
.strip button.noev i{opacity:0}
.strip button.on{background:var(--accent);color:#06101a}
.strip button.on b{color:#06101a}.strip button.on i{background:#06101a}
.ad{display:flex;flex-wrap:wrap;gap:.3rem;margin-bottom:.5rem;flex:none}
.ad span{font-size:.72rem;font-weight:500;padding:.2rem .6rem;border-radius:.5rem;border-left:.25rem solid var(--c);background:color-mix(in srgb,var(--c) 22%,var(--card))}
.ax{position:relative;flex:1;min-height:0;margin-left:2rem}
.hr{position:absolute;left:-2rem;right:0;border-top:1px solid var(--line);font-size:.6rem;color:var(--muted)}
.hr span{position:absolute;top:-.5em;left:0;line-height:1}
.e{position:absolute;border-radius:.7rem;padding:.35rem .6rem;font-size:.76rem;font-weight:500;border-left:.27rem solid var(--c);background:color-mix(in srgb,var(--c) 20%,var(--card));overflow:hidden;line-height:1.25;min-height:1.5rem}
.e small{display:block;font-weight:400;font-size:.62rem;color:var(--muted);margin-top:.05rem}
.e.s{display:flex;align-items:center;gap:.45rem;padding-top:0;padding-bottom:0;white-space:nowrap}
.e.s small{display:inline;margin:0}
.e.past{opacity:.45}
.e .ev{margin-right:.3rem}
.nowl{position:absolute;left:-2rem;right:0;border-top:2px solid var(--red);z-index:3;pointer-events:none}
.nowl b{position:absolute;left:0;top:-.58rem;background:var(--red);color:#fff;font-size:.6rem;padding:.08rem .35rem;border-radius:.5rem;font-weight:600}
.ag-empty{color:var(--muted);font-size:.9rem;padding:.4rem 0}
.legend{display:flex;flex-wrap:wrap;gap:.2rem .9rem;font-size:.66rem;color:var(--muted);padding-top:.55rem;flex:none}
.legend i{display:inline-block;width:.45rem;height:.45rem;border-radius:50%;margin-right:.3rem}
/* semana */
.wk-h{display:flex;margin-left:2rem;flex:none}
.wk-h button{flex:1;text-align:center;font-size:.66rem;color:var(--muted);text-transform:uppercase}
.wk-h button b{display:block;margin:.15rem auto .3rem;width:1.9rem;height:1.9rem;line-height:1.9rem;border-radius:50%;font-size:1rem;color:var(--fg);font-weight:600}
.wk-h button.t b{background:var(--accent);color:#06101a}
.wk-ad{display:flex;margin-left:2rem;flex:none;margin-bottom:.35rem}
.wk-ad div{flex:1;display:flex;flex-direction:column;gap:.15rem;padding:0 .12rem;min-height:.2rem}
.wk-ad span{font-size:.6rem;font-weight:500;padding:.1rem .35rem;border-radius:.35rem;border-left:.2rem solid var(--c);background:color-mix(in srgb,var(--c) 24%,var(--card));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk-g{position:absolute;inset:0;display:flex}
.wk-c{position:relative;flex:1;border-left:1px solid var(--line)}
.wk-c.t{background:color-mix(in srgb,var(--accent) 8%,transparent)}
.we{position:absolute;border-radius:.55rem;padding:.25rem .4rem;font-size:.66rem;font-weight:500;border-left:.22rem solid var(--c);background:color-mix(in srgb,var(--c) 24%,var(--card));overflow:hidden;line-height:1.2;min-height:1.2rem}
.we.s{display:flex;align-items:center;white-space:nowrap;padding-top:0;padding-bottom:0}
.we.past{opacity:.45}
/* casa */
.hm-wrap{flex:1;min-height:0;overflow:auto}
.hm-sec{font-size:.72rem;font-weight:500;color:var(--muted);margin:.75rem 0 .4rem}
.hm-sec:first-child{margin-top:0}
.hm-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.5rem;align-content:start}
.hm-grid.big{grid-template-columns:repeat(3,minmax(0,1fr));gap:.65rem}
.hm-tile{border-radius:1rem;background:var(--card2);padding:.65rem .7rem;display:flex;flex-direction:column;gap:.35rem;min-height:3.9rem;text-align:left;width:100%}
.hm-grid.big .hm-tile{padding:.85rem .95rem;min-height:5.2rem;border-radius:1.1rem}
.hm-tile.on{background:var(--hi);color:var(--hiink)}
.hm-tile.off{opacity:.45}
.hm-top{display:flex;justify-content:space-between;align-items:center;gap:.4rem}
.hm-n{font-size:.8rem;font-weight:500;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hm-grid.big .hm-n{font-size:.98rem}
.hm-n i{font-style:normal;margin-right:.3rem}
.hm-ic{font-size:1.15rem;line-height:1}
.hm-s{font-size:.66rem;color:var(--muted)}
.hm-grid.big .hm-s{font-size:.74rem}
.hm-tile.on .hm-s{color:var(--hiink);opacity:.72}
.hm-bar{height:.4rem;border-radius:.4rem;background:#ffffff26}
.hm-bar i{display:block;height:100%;border-radius:.4rem;background:var(--accent)}
.hm-tile.on .hm-bar{background:#1b240033}.hm-tile.on .hm-bar i{background:var(--hiink)}
.tg{width:2.3rem;height:1.35rem;border-radius:1rem;background:#ffffff2a;position:relative;flex:none;display:block}
.tg:after{content:"";position:absolute;top:.17rem;left:.17rem;width:1rem;height:1rem;border-radius:50%;background:#fff;transition:left .15s}
.hm-tile.on .tg,.tg.on{background:var(--hiink)}
.hm-tile.on .tg:after,.tg.on:after{left:1.12rem;background:var(--hi)}
.hm-dots{display:flex;gap:.3rem}.hm-dots i{width:.75rem;height:.75rem;border-radius:50%;display:block}
.hm-msg{font-size:.66rem;color:#e8a05a}
.ph{border:1px dashed var(--line);background:transparent;align-items:center;justify-content:center;text-align:center;color:var(--muted);font-size:.95rem;line-height:1.5}
.ph b{display:block;font-size:1.1rem;font-weight:500;margin-bottom:.2rem}
.row.empty{color:var(--muted);font-size:.85rem;padding:.3rem 0}
.casa{flex:none;max-height:56%}
.casa h2{cursor:pointer}
/* notícias */
.news{flex:1}
.news h2{cursor:pointer}
#nlist{flex:1;min-height:0;overflow:hidden;transition:opacity .4s}
#nlist.fade{opacity:0}
.nitem{padding:.5rem 0;border-bottom:1px solid var(--line);cursor:pointer}
.nitem:last-child{border-bottom:0}
.nitem:active{background:var(--card2)}
.nitem small{display:block;font-size:.66rem;font-weight:600;color:var(--accent);margin-bottom:.12rem}
.nitem small i{font-style:normal;margin-right:.25rem}
.nitem div{font-size:.8rem;line-height:1.3;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
/* modais */
.nw-m,.sp-m{position:fixed;inset:0;background:rgba(2,7,10,.8);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:9}
.nw-m[hidden],.sp-m[hidden]{display:none}
.md{background:var(--card);border:1px solid #ffffff1f;border-radius:1.5rem;padding:1.2rem 1.35rem;box-shadow:0 2rem 5rem #000a;display:flex;flex-direction:column;gap:.85rem;max-height:94vh;overflow:auto}
.md-h{display:flex;align-items:center;gap:.7rem;flex:none}
.md-h h3{font-size:1.2rem;font-weight:600}
.md-x{margin-left:auto;background:var(--card2);padding:.5rem .95rem;border-radius:.75rem;font-size:.8rem;font-weight:500}
.chips{display:flex;gap:.4rem;flex-wrap:wrap}
.chips button{font-size:.75rem;font-weight:500;padding:.42rem .8rem;border-radius:2rem;background:var(--card2);white-space:nowrap}
.chips button.on{background:var(--accent);color:#06101a;font-weight:600}
.chips.sc{flex-wrap:nowrap;overflow-x:auto}
.nw-b{width:min(40rem,94vw)}
.nw-b small{color:var(--accent);font-size:.8rem;font-weight:600}
.nw-b h3{font-size:1.5rem;line-height:1.22;font-weight:600}
.nw-b p{font-size:1rem;line-height:1.55;color:#c7d6dc}
.nw-b img{width:100%;max-height:13rem;object-fit:cover;border-radius:1rem;display:block}
.nw-a{display:flex;gap:.6rem;justify-content:flex-end;align-items:center}
.nw-a a,.nw-a button{font-size:.9rem;padding:.65rem 1.1rem;border-radius:.75rem;text-decoration:none}
.nw-a a{background:var(--accent);color:#06101a;font-weight:600}
.nw-a button{background:var(--card2);color:var(--fg)}
.nw-f{display:flex;justify-content:space-between;font-size:.68rem;color:var(--muted)}
.nl-b{width:min(44rem,94vw);height:min(90vh,38rem)}
.nl-l{flex:1;min-height:0;overflow:auto}
.nr{display:flex;gap:.8rem;padding:.7rem .2rem;border-bottom:1px solid var(--line);cursor:pointer;align-items:flex-start}
.nr .ic{width:2.2rem;height:2.2rem;border-radius:.7rem;background:var(--card2);display:grid;place-items:center;font-size:1.1rem;flex:none}
.nr small{display:block;font-size:.66rem;font-weight:600;color:var(--accent)}
.nr b{display:block;font-size:.95rem;font-weight:500;line-height:1.3;margin-top:.1rem}
.hd-b{width:min(50rem,94vw)}
.hd-sec{font-size:.72rem;color:var(--muted);font-weight:500;margin-bottom:-.35rem}
.lt-b{width:min(36rem,94vw)}
.lbl{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted)}
.lbl b{color:var(--fg);font-weight:600}
.bigsl{position:relative;height:3.4rem;border-radius:1.1rem;background:#ffffff1a;overflow:hidden}
.bigsl i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#ffd9a0,#fff4de)}
.bigsl b{position:absolute;right:1rem;top:0;bottom:0;display:flex;align-items:center;font-size:1.3rem;font-weight:600;color:#fff;mix-blend-mode:difference}
.bigsl input,.tmp input{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;cursor:pointer}
.sw{display:flex;gap:.55rem;flex-wrap:wrap}
.sw button{width:2.1rem;height:2.1rem;border-radius:50%;border:.17rem solid transparent}
.sw button.sel{border-color:#fff;box-shadow:0 0 0 .12rem var(--card)}
.wb{display:flex;gap:.55rem}
.wb button{flex:1;border-radius:.9rem;padding:.65rem .4rem;text-align:center;font-size:.78rem;font-weight:500;color:#222}
.wb button small{display:block;font-size:.66rem;color:#444;font-weight:400;margin-top:.1rem}
.wb button.sel{outline:.17rem solid #fff}
.tmp{position:relative;height:.8rem;border-radius:.8rem;background:linear-gradient(90deg,#ffb15e,#ffe9c9,#fff,#cfe2ff,#9ec5ff);margin:.2rem 0 .3rem}
.tmp i{position:absolute;top:-.3rem;width:1.4rem;height:1.4rem;margin-left:-.7rem;border-radius:50%;background:#fff;border:.17rem solid var(--card);pointer-events:none}
.cl-b{width:min(40rem,94vw)}
.cl-h{display:flex;align-items:center;gap:.5rem}
.cl-h .mt{flex:1;text-align:center;font-size:1.25rem;font-weight:600}
.cl-h button{background:var(--card2);border-radius:.75rem;padding:.5rem .9rem;font-size:.9rem}
.cl-g{display:grid;grid-template-columns:repeat(7,1fr);gap:.25rem}
.cl-w{text-align:center;font-size:.7rem;color:var(--muted);padding:.2rem 0}
.cl-d{background:var(--card2);border-radius:.7rem;color:var(--fg);font-size:1rem;height:3rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.2rem}
.cl-d.o{background:none;color:var(--muted);opacity:.45}
.cl-d.wkd{color:#ff9f8a}
.cl-d.td{outline:2px solid var(--accent)}
.cl-d.sel{background:var(--accent);color:#06101a;font-weight:600}
.cl-d i{display:flex;gap:2px;height:5px}
.cl-d i b{width:5px;height:5px;border-radius:50%;display:block}
.cl-l{border-top:1px solid var(--line);padding-top:.55rem;display:flex;flex-direction:column;gap:.35rem;min-height:3rem}
.cl-l .t{font-size:.8rem;color:var(--muted)}
.cl-l .e{position:static;display:flex;gap:.6rem;align-items:center;font-size:.95rem;font-weight:400;background:none;border:0;padding:0;overflow:visible}
.cl-l .e span.h{width:4.2rem;color:var(--muted);font-size:.8rem;flex:none}
.cl-l .e i{width:.55rem;height:.55rem;border-radius:50%;flex:none}
.wx-b{width:min(40rem,94vw)}
.wx-h{display:flex;align-items:center;gap:.9rem}
.wx-h .ic{font-size:3.2rem;line-height:1}
.wx-h .tp{font-size:3.2rem;font-weight:300;line-height:1}
.wx-h .ds{color:var(--muted);font-size:.95rem;line-height:1.4;flex:1}
.wx-h button{background:var(--card2);padding:.5rem .95rem;border-radius:.75rem;font-size:.85rem;align-self:flex-start}
.wx-g{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem}
.wx-g div{background:var(--card2);border-radius:.9rem;padding:.55rem .75rem;font-size:.75rem;color:var(--muted);line-height:1.35}
.wx-g b{display:block;font-weight:500;font-size:1.05rem;color:var(--fg)}
.wx-d{display:flex;flex-direction:column}
.wx-r{display:grid;grid-template-columns:4.4rem 2rem 1fr 6.2rem 3.4rem 3.2rem;gap:.5rem;align-items:center;padding:.5rem .1rem;border-bottom:1px solid var(--line);font-size:.9rem}
.wx-r:last-child{border-bottom:0}
.wx-r .dn{font-weight:500}
.wx-r .ic{font-size:1.4rem;text-align:center}
.wx-r .tx{color:var(--muted);font-size:.8rem;line-height:1.25}
.wx-r .tt{white-space:nowrap}
.wx-r .tt span{color:var(--muted)}
.wx-r .sm{color:var(--muted);font-size:.8rem;white-space:nowrap}
.wx-src{font-size:.7rem;color:var(--muted);text-align:right}
/* spotify */
.spot{flex:1;padding:1rem 1.1rem}
.sp-shelf{display:flex;gap:.5rem;align-items:center;overflow:hidden;padding-top:.7rem;flex:none}
.sp-shelf[hidden]{display:none}
.spot .sp-sh{flex:1;min-width:0;max-width:3.6rem;aspect-ratio:1;border-radius:.75rem;background:var(--card2);overflow:hidden;padding:0;display:flex;align-items:center;justify-content:center;font-size:1.3rem}
.spot .sp-sh img{width:100%;height:100%;object-fit:cover;display:block}
.spot .sp-sh.more{background:var(--card2);color:var(--fg);font-size:1.2rem}
.spot .sp-sh.auth{flex:none;max-width:none;aspect-ratio:auto;width:auto;padding:.55rem .9rem;font-size:.78rem;color:var(--fg);border-radius:.75rem}
.sp-lb{width:min(48rem,94vw);height:min(90vh,40rem)}
.sp-lh{display:flex;align-items:center;gap:.7rem;font-size:1.2rem;font-weight:600;flex:none}
.sp-lh button{margin-left:auto;background:var(--card2);padding:.5rem .95rem;border-radius:.75rem;font-size:.8rem;font-weight:500}
.sp-tabs,.sp-chips{display:flex;gap:.4rem;overflow-x:auto;flex:none}
.sp-tabs button,.sp-chips button{white-space:nowrap;padding:.42rem .8rem;border-radius:2rem;background:var(--card2);font-size:.78rem;font-weight:500}
.sp-tabs button.on{background:var(--accent);color:#06101a;font-weight:600}
.sp-chips button{font-size:.7rem;padding:.3rem .7rem;color:var(--muted)}
.sp-chips button.on{color:var(--fg);outline:1px solid var(--accent)}
.sp-q{display:flex;gap:.4rem;flex:none}
.sp-q input{flex:1;font-size:1rem;padding:.6rem .8rem;border-radius:.8rem;border:1px solid var(--accent);background:var(--bg);color:var(--fg);-webkit-user-select:text;user-select:text}
.sp-q button{background:var(--accent);color:#06101a;padding:.55rem 1.1rem;border-radius:.8rem;font-weight:600}
.sp-q[hidden],.sp-chips[hidden]{display:none}
.sp-ll{flex:1;min-height:0;overflow:auto}
.sp-lb .sp-ls{font-size:.72rem;color:var(--muted);font-weight:500;margin:.7rem 0 .2rem}
.sp-lb .sp-r{display:flex;width:100%;gap:.8rem;align-items:center;text-align:left;padding:.5rem .3rem;border-bottom:1px solid var(--line)}
.sp-r .im{width:3rem;height:3rem;flex:none;border-radius:.7rem;background:var(--card2);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:1.2rem}
.sp-r .im img{width:100%;height:100%;object-fit:cover;display:block}
.sp-r .tx{min-width:0;flex:1}
.sp-r .tn{font-size:.95rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp-r .ts{font-size:.74rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp-msg{color:var(--muted);padding:1rem .3rem;font-size:.9rem;line-height:1.5}
.sp-msg button{display:block;margin-top:.7rem;background:var(--accent);color:#06101a;padding:.65rem 1.1rem;border-radius:.75rem;font-weight:600}
.sp-c{display:flex;flex:1;min-height:0;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:.55rem;color:var(--muted);font-size:.9rem}
.sp-c b{color:var(--fg);font-weight:600;font-size:1.1rem}
.spot .sp-btn{background:var(--accent);color:#06101a;padding:.65rem 1.2rem;border-radius:.8rem;font-weight:600;font-size:.95rem}
.sp-play{display:flex;flex-direction:column;gap:.7rem;flex:1;min-height:0}
.sp-top{display:flex;gap:.9rem;align-items:center;flex:none}
.sp-art{width:6.2rem;height:6.2rem;flex:none;border-radius:1rem;background:var(--card2);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:2.2rem;color:var(--muted)}
.sp-art img{width:100%;height:100%;object-fit:cover;display:block}
.sp-meta{flex:1;min-width:0}
.sp-t{font-size:1.05rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp-a{font-size:.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:.1rem}
.spot .sp-dev{display:block;max-width:100%;font-size:.74rem;color:var(--muted);text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:.2rem 0}
.sp-bar{height:.3rem;background:#ffffff1f;border-radius:1rem;overflow:hidden;flex:none}
.sp-bar i{display:block;height:100%;width:0;background:var(--accent)}
.sp-ctl{display:flex;justify-content:space-between;align-items:center;flex:none;padding:0 .3rem}
.spot .sp-ctl button{padding:.35rem .8rem;border-radius:.7rem;line-height:0}
.spot .sp-ctl .big{background:var(--accent);color:#06101a;border-radius:50%;width:3.1rem;height:3.1rem;padding:0;display:flex;align-items:center;justify-content:center}
.sp-lib{font-size:.74rem;color:var(--muted)}
.sp-devs{flex:1;min-height:0;display:flex;flex-direction:column}
.sp-dl{flex:1;min-height:0;overflow:auto}
.spot .sp-dv{display:block;width:100%;text-align:left;padding:.6rem .3rem;border-bottom:1px solid var(--line);font-size:.9rem}
.spot .sp-dv.on{color:var(--accent)}
.sp-err{font-size:.7rem;color:#e8a05a;min-height:1em}
.spot [hidden]{display:none!important}
body.night .news{display:none}
body.night .c3 .casa{flex:1}
.status{position:fixed;left:1rem;bottom:.3rem;font-size:.62rem;color:var(--muted)}
.gate{position:fixed;inset:0;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;z-index:10}
.gate[hidden]{display:none}
.gate form{background:var(--card);border-radius:1.2rem;padding:1.4rem;width:min(28rem,90vw);display:flex;flex-direction:column;gap:.8rem}
.gate p{font-size:1rem;line-height:1.4}
.gate small{color:var(--muted);font-size:.8rem;min-height:1em}
.gate input{font-size:1.1rem;padding:.7rem;border-radius:.6rem;border:1px solid var(--line);background:var(--bg);color:var(--fg);-webkit-user-select:text;user-select:text}
.gate button{font-size:1.1rem;padding:.7rem;border-radius:.6rem;background:var(--accent);color:#06101a;font-weight:600}
</style>

<body>
<div class="app" id="app">
  <div class="col c1">
    <section class="card hero">
      <div class="clock" id="clock">--:--</div>
      <div class="date" id="date"></div>
      <div class="wx" id="wx"></div>
    </section>
    <section class="card ph spot" id="spot"><div><b>Spotify</b>por ligar (fase 2)</div></section>
  </div>

  <section class="card agenda" id="agenda">
    <div class="ag-h" id="agHead"></div>
    <div id="agBody" style="display:flex;flex-direction:column;flex:1;min-height:0"></div>
    <div class="legend" id="agLegend"></div>
  </section>

  <div class="col c3">
    <section class="card ph casa" id="casa"><div><b>Casa</b>Luzes e tomadas<br>por ligar (fase 4)</div></section>
    <section class="card news" id="news">
      <h2 id="nHead"><span>📰 Notícias</span><small id="npg"></small></h2>
      <div id="nlist"></div>
    </section>
  </div>
</div>

<div class="status" id="status"></div>

<div class="nw-m" id="nwM" hidden><div class="md nw-b" id="nwB"></div></div>
<div class="nw-m" id="nlM" hidden><div class="md nl-b" id="nlB"></div></div>
<div class="nw-m" id="hdM" hidden><div class="md hd-b" id="hdB"></div></div>
<div class="nw-m" id="ltM" hidden><div class="md lt-b" id="ltB"></div></div>
<div class="nw-m" id="clM" hidden><div class="md cl-b" id="clB"></div></div>
<div class="nw-m" id="wxM" hidden><div class="md wx-b" id="wxB"></div></div>

<div class="gate" id="gate" hidden>
  <form id="gateForm" autocomplete="off">
    <p><b>Chave de acesso</b><br>Introduz a chave que definiste no Worker. Só é pedida uma vez neste tablet.</p>
    <input id="gateKey" type="password" placeholder="Chave" autocapitalize="off" autocorrect="off" spellcheck="false">
    <small id="gateMsg"></small>
    <button type="submit">Guardar</button>
  </form>
</div>

<script src="config.js"></script>
<script>
(function () {
'use strict';

var C = Object.assign({
  WORKER_URL: '', LAT: 38.7, LON: -9.36,
  NIGHT_START: 23, NIGHT_END: 7, RELOAD_HOUR: 4,
  AGENDA_DAYS: 2, NEWS_PER_PAGE: 4, NEWS_ROTATE_SECONDS: 10,
  SHOW_PLACEHOLDERS: true,
  ICAL_URL: 'https://cdnjs.cloudflare.com/ajax/libs/ical.js/1.5.0/ical.min.js'
}, window.DASH_CONFIG || {});

var Q = new URLSearchParams(location.search);
var DEMO = Q.get('demo') === '1';
var HAS_WORKER = !!C.WORKER_URL && C.WORKER_URL.indexOf('SEU-WORKER') < 0;

function $(id) { return document.getElementById(id); }
function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function pad(n) { return (n < 10 ? '0' : '') + n; }
function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
function clear(n) { while (n.firstChild) n.removeChild(n.firstChild); }
function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }

if (!C.SHOW_PLACEHOLDERS) document.body.classList.add('compact');

/* ---------- estado e mensagens ---------- */
var statusMsgs = {};
function setStatus(k, msg) {
  if (msg) statusMsgs[k] = msg; else delete statusMsgs[k];
  $('status').textContent = Object.keys(statusMsgs).map(function (x) { return statusMsgs[x]; }).join(' · ');
}

/* ---------- relógio, data, modo noturno ---------- */
var fmtDate = new Intl.DateTimeFormat('pt-PT', { weekday: 'long', day: 'numeric', month: 'long' });
var fmtDay = new Intl.DateTimeFormat('pt-PT', { weekday: 'short', day: 'numeric', month: 'short' });
var WD3 = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
var fmtWd = { format: function (d) { return WD3[d.getDay()]; } };
var lastT = '';

function isNight(h) {
  var a = C.NIGHT_START, b = C.NIGHT_END;
  return a > b ? (h >= a || h < b) : (h >= a && h < b);
}

function tickClock() {
  var d = new Date();
  var t = pad(d.getHours()) + ':' + pad(d.getMinutes());
  if (t === lastT) return;
  lastT = t;
  $('clock').textContent = t;
  $('date').textContent = cap(fmtDate.format(d));
  document.body.classList.toggle('night', isNight(d.getHours()));
  renderAgenda();
  maybeReload(d);
}

var CL = { y: 0, m: 0, sel: null, timer: null };
function dayKey(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function eventsOn(ds) {
  var de = new Date(ds.getFullYear(), ds.getMonth(), ds.getDate() + 1);
  return events.filter(function (e) { return e.end > e.start ? (e.start < de && e.end > ds) : (e.start >= ds && e.start < de); })
    .sort(function (a, b) { return (b.allDay - a.allDay) || (a.start - b.start); });
}
function closeCal() { $('clM').hidden = true; if (CL.timer) { clearTimeout(CL.timer); CL.timer = null; } }
function drawCal() {
  var box = $('clB'); clear(box);
  var first = new Date(CL.y, CL.m, 1), today = new Date(), tk = dayKey(today);
  var h = el('div', 'cl-h');
  var pv = el('button', null, '‹'); pv.type = 'button'; pv.setAttribute('aria-label', 'Mês anterior');
  var nx = el('button', null, '›'); nx.type = 'button'; nx.setAttribute('aria-label', 'Mês seguinte');
  var td = el('button', null, 'Hoje'); td.type = 'button';
  var cx = el('button', null, 'Fechar'); cx.type = 'button';
  pv.addEventListener('click', function () { CL.m--; if (CL.m < 0) { CL.m = 11; CL.y--; } drawCal(); calTimer(); });
  nx.addEventListener('click', function () { CL.m++; if (CL.m > 11) { CL.m = 0; CL.y++; } drawCal(); calTimer(); });
  td.addEventListener('click', function () { CL.y = today.getFullYear(); CL.m = today.getMonth(); CL.sel = tk; drawCal(); calTimer(); });
  cx.addEventListener('click', closeCal);
  h.appendChild(pv); h.appendChild(el('div', 'mt', cap(new Intl.DateTimeFormat('pt-PT', { month: 'long', year: 'numeric' }).format(first)))); h.appendChild(nx); h.appendChild(td); h.appendChild(cx);
  box.appendChild(h);
  var g = el('div', 'cl-g');
  ['SEG', 'TER', 'QUA', 'QUI', 'SEX', 'SÁB', 'DOM'].forEach(function (w) { g.appendChild(el('div', 'cl-w', w)); });
  var lead = (first.getDay() + 6) % 7, start = new Date(CL.y, CL.m, 1 - lead), cells = Math.ceil((lead + new Date(CL.y, CL.m + 1, 0).getDate()) / 7) * 7;
  for (var i = 0; i < cells; i++) {
    (function (d) {
      var k = dayKey(d), b = el('button', 'cl-d'); b.type = 'button';
      if (d.getMonth() !== CL.m) b.className += ' o';
      if (d.getDay() === 0 || d.getDay() === 6) b.className += ' wkd';
      if (k === tk) b.className += ' td';
      if (k === CL.sel) b.className += ' sel';
      b.appendChild(el('span', null, String(d.getDate())));
      var ev = eventsOn(d), dots = el('i');
      ev.slice(0, 3).forEach(function (e) { var o = el('b'); o.style.background = k === CL.sel ? '#0b0e13' : e.color; dots.appendChild(o); });
      b.appendChild(dots);
      b.addEventListener('click', function () { CL.sel = k; if (d.getMonth() !== CL.m) { CL.m = d.getMonth(); CL.y = d.getFullYear(); } drawCal(); calTimer(); });
      g.appendChild(b);
    })(new Date(start.getFullYear(), start.getMonth(), start.getDate() + i));
  }
  box.appendChild(g);
  var sd = CL.sel ? new Date(CL.sel + 'T00:00:00') : today, l = el('div', 'cl-l');
  l.appendChild(el('div', 't', cap(new Intl.DateTimeFormat('pt-PT', { weekday: 'long', day: 'numeric', month: 'long' }).format(sd))));
  var list = eventsOn(sd);
  if (!list.length) l.appendChild(el('div', 'e', agendaState === 'ok' || DEMO ? 'Sem eventos' : 'Agenda sem dados'));
  list.slice(0, 6).forEach(function (e) {
    var r = el('div', 'e'), dot = el('i'); dot.style.background = e.color;
    r.appendChild(el('span', 'h', e.allDay ? 'Dia todo' : pad(e.start.getHours()) + ':' + pad(e.start.getMinutes())));
    r.appendChild(dot); var ei = evIcon(e.title); r.appendChild(el('span', null, (ei ? ei + ' ' : '') + e.title)); l.appendChild(r);
  });
  if (list.length > 6) l.appendChild(el('div', 't', '+' + (list.length - 6) + ' mais'));
  box.appendChild(l);
}
function calTimer() { clearTimeout(CL.timer); CL.timer = setTimeout(closeCal, 120000); }
function openCal() { var t = new Date(); CL.y = t.getFullYear(); CL.m = t.getMonth(); CL.sel = dayKey(t); drawCal(); $('clM').hidden = false; calTimer(); }
$('clock').addEventListener('click', openCal);
$('date').addEventListener('click', openCal);
$('clM').addEventListener('click', function (e) { if (e.target === this) closeCal(); });

function maybeReload(d) {
  if (DEMO || d.getHours() !== C.RELOAD_HOUR) return;
  var last = parseInt(store('dash_last_reload') || '0', 10);
  if (Date.now() - last > 20 * 3600 * 1000) { store('dash_last_reload', String(Date.now())); location.reload(); }
}

/* ---------- ecrã sempre ligado ---------- */
var wl = null;
function keepAwake() {
  if (!navigator.wakeLock) return;
  navigator.wakeLock.request('screen').then(function (l) {
    wl = l; l.addEventListener('release', function () { wl = null; });
  }).catch(function () {});
}
document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') keepAwake(); });

/* ---------- acesso ao Worker ---------- */
function getKey() { return store('dash_key') || ''; }
function showGate(msg) { $('gate').hidden = false; $('gateMsg').textContent = msg || ''; $('gateKey').focus(); }
$('gateForm').addEventListener('submit', function (e) {
  e.preventDefault();
  var v = $('gateKey').value.trim();
  if (!v) return;
  store('dash_key', v);
  $('gateKey').value = '';
  $('gate').hidden = true;
  loadAll();
});

function api(path, body) {
  var o = { headers: { 'X-Dash-Key': getKey() }, cache: 'no-store' };
  if (body) { o.method = 'POST'; o.headers['Content-Type'] = 'application/json'; o.body = JSON.stringify(body); }
  return fetch(C.WORKER_URL.replace(/\/$/, '') + path, o)
    .then(function (r) {
      if (r.status === 401) { showGate('Chave incorreta. Tenta outra vez.'); throw new Error('401'); }
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    });
}

/* ---------- meteo (IPMA; Open-Meteo como reserva) ---------- */
var WXD = null;
var IPMA = {
  1: ['Céu limpo', '☀️'], 2: ['Pouco nublado', '🌤️'], 3: ['Parcialmente nublado', '⛅'], 4: ['Muito nublado', '☁️'], 5: ['Nuvens altas', '🌥️'],
  6: ['Aguaceiros', '🌦️'], 7: ['Aguaceiros fracos', '🌦️'], 8: ['Aguaceiros fortes', '🌧️'], 9: ['Chuva', '🌧️'], 10: ['Chuva fraca', '🌦️'],
  11: ['Chuva forte', '🌧️'], 12: ['Períodos de chuva', '🌧️'], 13: ['Chuva fraca', '🌦️'], 14: ['Chuva forte', '🌧️'], 15: ['Chuvisco', '🌦️'],
  16: ['Neblina', '🌫️'], 17: ['Nevoeiro', '🌫️'], 18: ['Neve', '❄️'], 19: ['Trovoada', '⛈️'], 20: ['Aguaceiros e trovoada', '⛈️'],
  21: ['Granizo', '🌨️'], 22: ['Geada', '❄️'], 23: ['Chuva e trovoada', '⛈️'], 24: ['Nebulosidade convectiva', '⛅'], 25: ['Períodos nublados', '⛅'],
  26: ['Nevoeiro', '🌫️'], 27: ['Nublado', '☁️'], 28: ['Aguaceiros de neve', '❄️'], 29: ['Chuva e neve', '🌨️'], 30: ['Chuva e neve', '🌨️']
};
function ipmaW(id, day) {
  var w = IPMA[id] || ['—', '🌡️'], icon = w[1];
  if (day === 0 && (id === 1 || id === 2)) icon = '🌙';
  return { text: w[0], icon: icon };
}
function ipmaCurrent(stations) {
  return fetch('https://api.ipma.pt/open-data/observation/meteorology/stations/observations.json', { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error('obs'); return r.json(); })
    .then(function (ob) {
      var hours = Object.keys(ob).sort().reverse(), out = {};
      var F = { t: ['temperatura', -50], h: ['humidade', 0], wk: ['intensidadeVentoKM', 0], p: ['pressao', 800] };
      Object.keys(F).forEach(function (k) {
        for (var h = 0; h < hours.length && h < 6 && out[k] == null; h++) for (var i = 0; i < stations.length; i++) {
          var o = ob[hours[h]][stations[i]], v = o && o[F[k][0]];
          if (typeof v === 'number' && v > F[k][1]) { out[k] = v; break; }
        }
      });
      return out;
    }).catch(function () { return {}; });
}
function ipmaUv(city) {
  return fetch('https://api.ipma.pt/open-data/forecast/meteorology/uv/uv.json', { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error('uv'); return r.json(); })
    .then(function (j) { var m = {}; (j.data || j).forEach(function (x) { if (x.globalIdLocal === city) m[x.data] = parseFloat(x.iUv); }); return m; })
    .catch(function () { return {}; });
}
function loadIpma() {
  var city = C.IPMA_CITY || 1110600, sts = C.IPMA_STATIONS || [6215360, 1210765, 1200535];
  return Promise.all([
    fetch('https://api.ipma.pt/open-data/forecast/meteorology/cities/daily/' + city + '.json', { cache: 'no-store' }).then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); }),
    ipmaCurrent(sts), ipmaUv(city)
  ]).then(function (a) {
    var f = (a[0] && a[0].data) || [];
    if (!f.length) throw new Error('vazio');
    var hr = new Date().getHours(), day = (hr >= 7 && hr < 20) ? 1 : 0;
    var o = a[1] || {}, uv = a[2] || {}, t = o.t != null ? o.t : (parseFloat(f[0].tMax) + parseFloat(f[0].tMin)) / 2;
    return {
      current: { temperature_2m: t, ipma: f[0].idWeatherType, is_day: day, hum: o.h, windkm: o.wk, pres: o.p },
      daily: {
        time: f.map(function (x) { return x.forecastDate; }), ipma: f.map(function (x) { return x.idWeatherType; }),
        temperature_2m_max: f.map(function (x) { return parseFloat(x.tMax); }), temperature_2m_min: f.map(function (x) { return parseFloat(x.tMin); }),
        precipitation_probability_max: f.map(function (x) { return Math.round(parseFloat(x.precipitaProb) || 0); }),
        wdir: f.map(function (x) { return x.predWindDir; }), wcls: f.map(function (x) { return x.classWindSpeed; }), uv: f.map(function (x) { return uv[x.forecastDate]; })
      }
    };
  });
}
var WMO = {
  0: ['Céu limpo', '☀️'], 1: ['Pouco nublado', '🌤️'], 2: ['Parcialmente nublado', '⛅'], 3: ['Nublado', '☁️'],
  45: ['Nevoeiro', '🌫️'], 48: ['Nevoeiro', '🌫️'],
  51: ['Chuvisco', '🌦️'], 53: ['Chuvisco', '🌦️'], 55: ['Chuvisco', '🌦️'], 56: ['Chuvisco gelado', '🌧️'], 57: ['Chuvisco gelado', '🌧️'],
  61: ['Chuva fraca', '🌧️'], 63: ['Chuva', '🌧️'], 65: ['Chuva forte', '🌧️'], 66: ['Chuva gelada', '🌧️'], 67: ['Chuva gelada', '🌧️'],
  71: ['Neve fraca', '❄️'], 73: ['Neve', '❄️'], 75: ['Neve forte', '❄️'], 77: ['Grãos de neve', '❄️'],
  80: ['Aguaceiros', '🌦️'], 81: ['Aguaceiros', '🌦️'], 82: ['Aguaceiros fortes', '🌧️'], 85: ['Aguaceiros de neve', '❄️'], 86: ['Aguaceiros de neve', '❄️'],
  95: ['Trovoada', '⛈️'], 96: ['Trovoada com granizo', '⛈️'], 99: ['Trovoada com granizo', '⛈️']
};
function wmo(code, day) {
  var w = WMO[code] || ['—', '🌡️'];
  var icon = w[1];
  if (day === 0 && (code === 0 || code === 1)) icon = '🌙';
  return { text: w[0], icon: icon };
}

function renderWeather(j) {
  WXD = j;
  var box = $('wx'); clear(box);
  var cur = j.current, d = j.daily;
  var w = cur.ipma != null ? ipmaW(cur.ipma, cur.is_day) : wmo(cur.weather_code, cur.is_day);
  var now = el('div', 'now');
  now.appendChild(el('div', 'ic', w.icon));
  now.appendChild(el('div', 'tp', Math.round(cur.temperature_2m) + '°'));
  var ds = el('div', 'ds');
  ds.appendChild(document.createTextNode(w.text));
  ds.appendChild(el('br'));
  ds.appendChild(document.createTextNode('máx ' + Math.round(d.temperature_2m_max[0]) + '° · mín ' + Math.round(d.temperature_2m_min[0]) + '°'));
  ds.appendChild(el('br'));
  ds.appendChild(document.createTextNode('💧 chuva ' + (d.precipitation_probability_max[0] || 0) + '%'));
  now.appendChild(ds);
  box.appendChild(now);
  var nx = el('div', 'nx');
  for (var i = 1; i < d.time.length && i < 5; i++) {
    var dd = el('div', 'dd');
    var dt = new Date(d.time[i] + 'T12:00:00');
    dd.appendChild(document.createTextNode(cap(fmtWd.format(dt).replace('.', ''))));
    dd.appendChild(el('b', null, d.ipma ? ipmaW(d.ipma[i], 1).icon : wmo(d.weather_code[i], 1).icon));
    dd.appendChild(document.createTextNode(Math.round(d.temperature_2m_max[i]) + '°'));
    nx.appendChild(dd);
  }
  box.appendChild(nx);
}

var WX_DIR = { N: 'Norte', NE: 'Nordeste', E: 'Este', SE: 'Sudeste', S: 'Sul', SW: 'Sudoeste', W: 'Oeste', NW: 'Noroeste' };
var WX_WCLS = { 1: 'Fraco', 2: 'Moderado', 3: 'Forte', 4: 'Muito forte' };
function uvLabel(u) { return u == null || isNaN(u) ? '—' : u < 3 ? 'Baixo' : u < 6 ? 'Moderado' : u < 8 ? 'Alto' : u < 11 ? 'Muito alto' : 'Extremo'; }
function sunTimes() {
  var d = new Date(), rad = Math.PI / 180, n = Math.floor((d - new Date(d.getFullYear(), 0, 0)) / 864e5);
  var g = (2 * Math.PI / 365) * (n - 1), eq = 229.18 * (0.000075 + 0.001868 * Math.cos(g) - 0.032077 * Math.sin(g) - 0.014615 * Math.cos(2 * g) - 0.040849 * Math.sin(2 * g));
  var dec = 0.006918 - 0.399912 * Math.cos(g) + 0.070257 * Math.sin(g) - 0.006758 * Math.cos(2 * g) + 0.000907 * Math.sin(2 * g) - 0.002697 * Math.cos(3 * g) + 0.00148 * Math.sin(3 * g);

    var l2 = el('div', 'lbl'); l2.appendChild(el('span', null, 'Brancos')); var kv = el('b', null, d.kelvin ? d.kelvin + ' K' : ''); l2.appendChild(kv); b.appendChild(l2);
    var wb = el('div', 'wb');
    HOME_WHITES.forEach(function (w) {
      var k = Math.min(tmax, Math.max(tmin, w[1])), bt = el('button', d.pick === 'w' + w[1] ? 'sel' : null, w[2]); bt.type = 'button'; bt.style.background = w[0];
      bt.appendChild(el('small', null, k + ' K'));
      bt.addEventListener('click', function () { d.pick = 'w' + w[1]; d.kelvin = k; homeSend(d, 'temp', k); ltRender(); }); wb.appendChild(bt);
    });
    b.appendChild(wb);
    var l3 = el('div', 'lbl'); l3.appendChild(el('span', null, 'Temperatura')); l3.appendChild(el('span', null, 'quente ↔ frio')); b.appendChild(l3);
    var tp = el('div', 'tmp'), th = el('i'), tr = document.createElement('input'), kk = d.kelvin || Math.round((tmin + tmax) / 2);
    tr.type = 'range'; tr.min = tmin; tr.max = tmax; tr.step = 50; tr.value = kk;
    function pos() { th.style.left = ((+tr.value - tmin) / (tmax - tmin) * 100) + '%'; }
    pos();
    tr.addEventListener('input', function () { home.drag = Date.now(); pos(); kv.textContent = tr.value + ' K'; });
    tr.addEventListener('change', function () { home.drag = 0; d.kelvin = +tr.value; d.pick = 'k'; homeSend(d, 'temp', +tr.value); ltRender(); });
    tp.appendChild(th); tp.appendChild(tr); b.appendChild(tp);
  }
  if (!d.canBright && !d.canColor && !d.canTemp) b.appendChild(el('div', 'ag-empty', 'Esta luz só liga e desliga.'));
}
/* ---- envio de comandos ---- */
function homeSend(d, action, value) {
  if (DEMO) return Promise.resolve();
  return api('/home/set', { provider: d.provider, id: d.id, sku: d.sku, action: action, value: value })
    .then(function () { home.err = ''; clearTimeout(home.timer); home.timer = setTimeout(homeLoad, 4000); })
    .catch(function (e) { if (String(e.message) === '401') return; home.err = 'Falhou'; homeLoad(); });
}
function homeToggle(d) {
  if (d.online === false) return;
  d.on = !d.on; homeRender();
  homeSend(d, 'power', d.on ? 1 : 0);
}
function homeScene(sc) {
  var devs = (home.devices || []).filter(function (d) { return d.online !== false; }), ops = [];
  sc.rules.forEach(function (r) {
    devs.forEach(function (d) {
      if (!r.all && String(d.name).toLowerCase().trim() !== r.dev) return;
      if (r.power != null && !!d.on !== !!r.power) { d.on = !!r.power; ops.push([d, 'power', r.power ? 1 : 0]); }
      if (r.power === 0) return;
      if (r.brightness != null && d.canBright) { var v = Math.max(d.bmin || 0, Math.round(r.brightness / 100 * (d.bmax || 100))); d.brightness = v; ops.push([d, 'brightness', v]); }
      if (r.temp != null && d.canTemp) { var k = Math.min(d.tmax || 6500, Math.max(d.tmin || 2700, r.temp)); d.kelvin = k; d.pick = 'k'; ops.push([d, 'temp', k]); }
    });
  });
  homeRender();
  var chain = Promise.resolve();
  ops.forEach(function (o) { chain = chain.then(function () { return homeSend(o[0], o[1], o[2]); }); });
}
function homeLoad() {
  if (!HAS_WORKER && !DEMO) return;
  homeBuild();
  if (DEMO) {
    if (!home.devices) home.devices = [
      { provider: 'govee', id: '1', sku: 'x', name: 'Desk Lights', canColor: true, canTemp: true, tmin: 2000, tmax: 9000, canBright: true, bmin: 1, bmax: 100, on: true, brightness: 70, online: true },
      { provider: 'govee', id: '2', sku: 'x', name: 'Desk Lamp', canBright: true, bmin: 1, bmax: 100, on: false, brightness: 30, online: true },
      { provider: 'tuya', id: '3', sku: 'x', name: 'Ceiling Light', canBright: true, bmin: 10, bmax: 1000, on: true, brightness: 450, online: true },
      { provider: 'govee', id: '4', sku: 'x', name: 'Fado', canBright: false, on: false, online: true },
      { provider: 'govee', id: '5', sku: 'x', name: 'Airplane', canBright: false, on: false, online: false }];
    homeRender(); return;
  }
  api('/home').then(function (j) {
    var old = {}; (home.devices || []).forEach(function (d) { old[d.provider + ':' + d.id] = d; });
    home.devices = (j.devices || []).map(function (d) { var o = old[d.provider + ':' + d.id]; if (o) { d.pick = o.pick; d.kelvin = o.kelvin; } return d; });
    home.err = (j.errors && j.errors.length) ? 'Erro: ' + j.errors[0].slice(0, 60) : '';
    homeRender();
  }).catch(function (e) {
    if (String(e.message) === '401') return;
    home.err = 'Sem ligação'; homeRender();
  });
}

/* ---------- arranque ---------- */
function loadAll() {
  loadWeather();
  loadAgenda();
  loadNews();
  homeLoad();
}

spStart();
tickClock();
setInterval(tickClock, 1000);
renderAgenda();
renderNews();
startNewsRotation();
keepAwake();

if (HAS_WORKER && !DEMO && !getKey()) showGate('');
else loadAll();

setInterval(loadWeather, 15 * 60 * 1000);
setInterval(loadAgenda, 10 * 60 * 1000);
setInterval(loadNews, 15 * 60 * 1000);
setInterval(function () { if (!document.hidden && !isNight(new Date().getHours())) homeLoad(); }, 30 * 1000);

if (!DEMO && 'serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').catch(function () {});
}

window.__dash = { buildEvents: buildEvents, demoSources: demoSources };
})();
</script>
